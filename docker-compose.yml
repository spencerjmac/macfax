services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cbb_analytics
      POSTGRES_USER: cbb_user
      POSTGRES_PASSWORD: cbb_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbb_user -d cbb_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env.docker
    environment:
      DATABASE_URL: postgres://cbb_user:cbb_password@db:5432/cbb_analytics
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python manage.py migrate && python manage.py rqworker default high low &
 gunicorn config.wsgi:application --bind 0.0.0.0:8000"]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      SKIP_DATA_BUILD: "1"
      NEXT_PUBLIC_API_BASE_URL: "http://backend:8000"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
