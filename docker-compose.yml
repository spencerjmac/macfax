services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cbb_analytics
      POSTGRES_USER: cbb_user
      POSTGRES_PASSWORD: cbb_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbb_user -d cbb_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env.docker
    environment:
      DATABASE_URL: postgres://cbb_user:cbb_password@db:5432/cbb_analytics
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "7001:8000"
    command: ["sh", "-c", "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"]

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 7000
      NEXT_PUBLIC_API_BASE_URL: "http://backend:8000"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
