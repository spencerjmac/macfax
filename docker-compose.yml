services:
  redis:
    image: redis:7-alpine
    networks:
      web:
        aliases:
          - macfax_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cbb_analytics
      POSTGRES_USER: cbb_user
      POSTGRES_PASSWORD: cbb_password
    networks:
      web:
        aliases:
          - macfax_db 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbb_user -d cbb_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    hostname: macfax_api
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.docker
    environment:
      REDIS_URL: "redis://redis:6379/1"
      RUNNING_IN_DOCKER: "1"
      # Play-by-play and native BPR possession caches (settings.NBA_CACHE_DIR)
      NBA_CACHE_DIR: /cache/nba
      # update_* run log, one JSON line per run (ncaa/pipeline_log.py); on a volume so it survives deploys
      PIPELINE_LOG_DIR: /var/log/macfax
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      web:
        aliases:
          - macfax_api
    volumes:
      - macfax_static:/app/staticfiles
      - macfax_nba_cache:/cache/nba
      - macfax_pipeline_logs:/var/log/macfax
    ports:
      - "127.0.0.1:7001:7001"
    command: ["sh", "-c", "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py import_logos && python manage.py nba_sync_teams && gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:7001 --workers 2 --timeout 600 --access-logfile - --error-logfile - --log-level debug"]

  # Runs `update_daily` once a day (NBA/NCAA, each only while in season).
  # Same image and env as the backend; does not migrate or serve traffic.
  # Logs: docker compose logs -f scheduler
  scheduler:
    hostname: macfax_scheduler
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.docker
    environment:
      REDIS_URL: "redis://redis:6379/1"
      RUNNING_IN_DOCKER: "1"
      # Daily run time, HH:MM UTC (10:00 UTC = 06:00 ET, after West Coast finals)
      DAILY_UPDATE_AT: "10:00"
      # Play-by-play and native BPR possession caches, shared with the backend
      NBA_CACHE_DIR: /cache/nba
      # update_* run log (the nightly's steps, rc and timings), shared with the backend
      PIPELINE_LOG_DIR: /var/log/macfax
      # Prod write lock shared with fab (ops/prod-lock.sh): the nightly holds it as "nightly" and
      # waits up to NIGHTLY_LOCK_WAIT_MIN minutes for another holder, then skips (ncaa/prod_lock.py)
      PROD_LOCK_DIR: /locks/prod
      NIGHTLY_LOCK_WAIT_MIN: "60"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      web:
        aliases:
          - macfax_scheduler
    restart: unless-stopped
    volumes:
      - macfax_nba_cache:/cache/nba
      - macfax_pipeline_logs:/var/log/macfax
      # host /opt/macfax/.locks (fab creates it as macfax when it first takes the lock)
      - ./.locks:/locks
    command: ["python", "manage.py", "run_scheduler"]

  web:
    hostname: macfax_web
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked into the client bundle at build time — must be the external URL
        NEXT_PUBLIC_API_BASE_URL: "https://macfax.usu.edu"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 7000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:7000:7000"
    networks:
      web:
        aliases:
          - macfax_web

networks:
  web:
    external: true

volumes:
  postgres_data:
  macfax_static:
    external: true
  # NBA file caches (pbp responses, native possession totals); created by compose
  macfax_nba_cache:
  # update_* run log (pipeline_runs.jsonl); created by compose, kept across container recreation
  macfax_pipeline_logs:
