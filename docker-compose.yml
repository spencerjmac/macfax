services:
  redis:
    image: redis:7-alpine
    networks:
      web:
        aliases:
          - macfax_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cbb_analytics
      POSTGRES_USER: cbb_user
      POSTGRES_PASSWORD: cbb_password
    networks:
      web:
        aliases:
          - macfax_db 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbb_user -d cbb_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    hostname: macfax_api
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.docker
    environment:
      REDIS_URL: "redis://redis:6379/1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      web:
        aliases:
          - macfax_api
    volumes:
      - macfax_static:/app/staticfiles
    ports:
      - "127.0.0.1:7001:7001"
    command: ["sh", "-c", "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py import_logos && python manage.py nba_sync_teams && gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:7001 --workers 2 --timeout 600 --access-logfile - --error-logfile - --log-level debug"]

  web:
    hostname: macfax_web
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked into the client bundle at build time — must be the external URL
        NEXT_PUBLIC_API_BASE_URL: "https://macfax.usu.edu"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 7000
    depends_on:
      - backend
    ports:
      - "127.0.0.1:7000:7000"
    networks:
      web:
        aliases:
          - macfax_web

networks:
  web:
    external: true

volumes:
  postgres_data:
  macfax_static:
    external: true
