services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cbb_analytics
      POSTGRES_USER: cbb_user
      POSTGRES_PASSWORD: cbb_password
    networks:
      web:
        aliases:
          - macfax_db 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbb_user -d cbb_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    hostname: macfax_api
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      USE_X_FORWARDED_HOST: ${USE_X_FORWARDED_HOST}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      web:
        aliases:
          - macfax_api
    volumes:
      - macfax_static:/app/staticfiles
    ports:
      - "7001:7001"
    command: ["sh", "-c", "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:7001"]

  web:
    hostname: macfax_web
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # Baked into the client bundle at build time — must be the external URL
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 7000
      # Server-side only (not exposed to browser) — internal Docker hostname
      # Using IP directly as hostname resolution has issues
      API_INTERNAL_URL: ${API_INTERNAL_URL}
      # Fallback public URL for server-side if internal isn't set
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      - backend
    ports:
      - "7000:7000"
    networks:
      web:
        aliases:
          - macfax_web

networks:
  web:
    external: true

volumes:
  postgres_data:
  macfax_static:
    external: true