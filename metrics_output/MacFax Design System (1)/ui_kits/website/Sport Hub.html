<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacFax — Sport Hub</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="redesign.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script src="data.js"></script>
<script type="text/babel">
const { useState } = React;

/* ---------------- Icons (Lucide, stroke 1.5) ---------------- */
const PATHS = {
  'trophy':      <><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></>,
  'swords':      <><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="M5 14l9 9"/></>,
  'scatter':     <><circle cx="7.5" cy="16.5" r="1.4"/><circle cx="11" cy="11" r="1.4"/><circle cx="16.5" cy="7" r="1.4"/><circle cx="15" cy="14" r="1.4"/><path d="M3 3v18h18"/></>,
  'book-open':   <><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>,
  'crystal':     <><circle cx="12" cy="10" r="6.5"/><path d="M9.5 7.2A3.5 3.5 0 0 1 12 6.2"/><path d="M7 16c-1 1-1.6 2.2-1.6 3.5M17 16c1 1 1.6 2.2 1.6 3.5"/><path d="M5 20.5h14"/></>,
  'gauge':       <><path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/></>,
  'calendar':    <><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></>,
  'arrow-right': <><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>,
};
const Icon = ({ name, size = 20, stroke = 1.5 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">{PATHS[name] || null}</svg>
);

/* art for viz cards */
const VizArt = ({ kind }) => {
  if (kind === 'trapezoid') return (
    <svg width="150" height="90" viewBox="0 0 150 90" fill="none" stroke="currentColor" strokeWidth="1.4">
      <path d="M30 70 L52 22 L98 22 L120 70 Z" opacity="0.5"/>
      <circle cx="66" cy="40" r="3.5" fill="currentColor" stroke="none"/>
      <circle cx="84" cy="34" r="3.5" fill="currentColor" stroke="none"/>
      <circle cx="75" cy="52" r="3.5" fill="currentColor" stroke="none"/>
      <circle cx="52" cy="58" r="3" fill="currentColor" stroke="none" opacity="0.6"/>
      <circle cx="98" cy="60" r="3" fill="currentColor" stroke="none" opacity="0.6"/>
    </svg>
  );
  if (kind === 'landscape') return (
    <svg width="150" height="90" viewBox="0 0 150 90" fill="none" stroke="currentColor" strokeWidth="1.4">
      <line x1="20" y1="78" x2="130" y2="78" opacity="0.4"/>
      <line x1="20" y1="78" x2="20" y2="12" opacity="0.4"/>
      <circle cx="50" cy="55" r="4" fill="currentColor" stroke="none"/>
      <circle cx="80" cy="38" r="4" fill="currentColor" stroke="none"/>
      <circle cx="100" cy="28" r="4" fill="currentColor" stroke="none"/>
      <circle cx="65" cy="62" r="3" fill="currentColor" stroke="none" opacity="0.6"/>
      <circle cx="110" cy="48" r="3" fill="currentColor" stroke="none" opacity="0.6"/>
    </svg>
  );
  return (
    <svg width="150" height="90" viewBox="0 0 150 90" fill="none" stroke="currentColor" strokeWidth="1.4">
      <circle cx="75" cy="36" r="23"/>
      <path d="M64 26a12 12 0 0 1 9-5" opacity="0.75" strokeWidth="1.6"/>
      <path d="M60 56c-4 4-6 9-6 15M90 56c4 4 6 9 6 15"/>
      <path d="M48 73h54" strokeWidth="1.6"/>
      <path d="M118 22l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="currentColor" stroke="none" opacity="0.7"/>
    </svg>
  );
};

/* ---------------- Nav ---------------- */
function Nav({ sport, setSport }) {
  const NAV = sport === 'nba'
    ? ['Rankings', 'Visualizations', 'Model Health']
    : ['Rankings', 'Matchup', 'Outlook', 'Visualizations', 'Glossary'];
  return (
    <nav className="mfx-nav">
      <div className="mfx-nav__in">
        <button className="mfx-brand" onClick={() => { location.href = 'Homepage Redesign.html'; }}>
          <img src="../../assets/macfax-logo.png" alt="" />
          <span>macfax</span>
        </button>
        <div className="mfx-nav__nav">
          <div className="mfx-sport">
            <button className={sport === 'ncaa' ? 'on' : ''} onClick={() => setSport('ncaa')}>NCAA</button>
            <button className={sport === 'nba'  ? 'on' : ''} onClick={() => setSport('nba')}>NBA</button>
          </div>
          <span className="mfx-div" />
          {NAV.map((l) => <button key={l} className="mfx-link">{l}</button>)}
          <span className="mfx-div" />
          <button className="mfx-link">About</button>
        </div>
      </div>
    </nav>
  );
}

/* ---------------- Hub ---------------- */
function Hub({ sport }) {
  const cfg = HUB[sport];
  const teams = cfg.teams;
  const leader = teams[0];

  return (
    <React.Fragment>
      {/* hero */}
      <header className="mfx-shero">
        <div className="mfx-wrap">
          <div className="mfx-shero__grid">
            <div className="mfx-shero__copy">
              <p className="mfx-eyebrow"><span className="dot" /> {cfg.eyebrow}</p>
              <h1>{cfg.title}</h1>
              <p className="mfx-shero__lede">{cfg.lede}</p>
              <div className="mfx-cta-row" style={{ marginTop: 6 }}>
                <button className="mfx-btn mfx-btn--primary mfx-btn--sm">Full rankings <Icon name="arrow-right" size={16} /></button>
                <button className="mfx-btn mfx-btn--ghost mfx-btn--sm">{cfg.secondaryCta}</button>
              </div>
            </div>

            {/* leader spotlight */}
            <aside className="mfx-spot">
              <div className="mfx-spot__tag"><span className="live" /> #1 in the model</div>
              <div className="mfx-spot__team">
                <img className="mfx-spot__logo" src={teamLogo(leader)} alt="" />
                <div>
                  <div className="mfx-spot__rk">{cfg.label} · No. 1</div>
                  <div className="mfx-spot__nm">{leader.name}</div>
                  <div className="mfx-spot__meta">{leader.conf} · {leader.rec}</div>
                </div>
              </div>
              <div className="mfx-spot__stats">
                <div className="mfx-spot__stat"><span className="k">AdjEM</span><span className="v">{leader.em > 0 ? '+' : ''}{leader.em.toFixed(1)}</span></div>
                <div className="mfx-spot__stat"><span className="k">AdjO</span><span className="v">{leader.o.toFixed(1)}</span></div>
                <div className="mfx-spot__stat"><span className="k">AdjD</span><span className="v">{leader.d.toFixed(1)}</span></div>
              </div>
            </aside>
          </div>
        </div>
      </header>

      {/* top of rankings */}
      <section className="mfx-section mfx-section--tight">
        <div className="mfx-wrap">
          <div className="mfx-shead">
            <div>
              <p className="mfx-kick">This week</p>
              <h2 className="mfx-h2">Top of the {cfg.label} rankings</h2>
            </div>
            <button className="mfx-seelink">All {cfg.teamCount} teams <Icon name="arrow-right" size={15} /></button>
          </div>
          <div className="mfx-strip">
            {teams.slice(0, 5).map((tm, i) => (
              <button key={tm.id} className="mfx-srow">
                <span className="mfx-srow__rk">{i + 1}</span>
                <img className="mfx-srow__logo" src={teamLogo(tm)} alt="" />
                <span>
                  <span className="mfx-srow__nm">{tm.name}</span>
                  <span className="mfx-srow__cf">{tm.conf} · {tm.rec}</span>
                </span>
                <span className="mfx-srow__col"><span className="k">AdjO</span><span className="v">{tm.o.toFixed(1)}</span></span>
                <span className="mfx-srow__col" style={{ textAlign:'right' }}><span className="k">AdjEM</span><span className="v em">{tm.em>0?'+':''}{tm.em.toFixed(2)}</span></span>
              </button>
            ))}
          </div>
        </div>
      </section>

      {/* tools */}
      <section className="mfx-section mfx-section--alt mfx-section--tight">
        <div className="mfx-wrap">
          <div className="mfx-shead">
            <div>
              <p className="mfx-kick">Explore</p>
              <h2 className="mfx-h2">{cfg.label} tools</h2>
            </div>
          </div>
          <div className="mfx-tools">
            {cfg.tools.map(t => (
              <div key={t.t} className="mfx-tool">
                <span className="mfx-tool__ic"><Icon name={t.i} size={22} /></span>
                <div>
                  <h4>{t.t} {t.soon ? <span className="mfx-status mfx-status--soon">Soon</span> : null}</h4>
                  <p>{t.b}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* visualizations */}
      <section className="mfx-section mfx-section--tight">
        <div className="mfx-wrap">
          <div className="mfx-shead">
            <div>
              <p className="mfx-kick">Latest</p>
              <h2 className="mfx-h2">{cfg.label} visualizations</h2>
            </div>
            <button className="mfx-seelink">All visualizations <Icon name="arrow-right" size={15} /></button>
          </div>
          <div className="mfx-vizgrid">
            {cfg.viz.map(v => (
              <article key={v.t} className="mfx-viz">
                <div className="mfx-viz__art"><VizArt kind={v.art} /></div>
                <div className="mfx-viz__body">
                  <span className="mfx-viz__kick">{v.kick}</span>
                  <h4>{v.t}</h4>
                  <p>{v.b}</p>
                  <div className="mfx-viz__foot">
                    <span className="mfx-viz__link">Open <Icon name="arrow-right" size={14} /></span>
                  </div>
                </div>
              </article>
            ))}
          </div>
        </div>
      </section>
    </React.Fragment>
  );
}

function Footer() {
  return (
    <footer className="mfx-foot">
      <div className="mfx-foot__in">
        <div className="mfx-foot__brand">
          <img src="../../assets/macfax-logo.png" alt="" />
          <span>macfax</span>
        </div>
        <div className="mfx-foot__links">
          <a>Model Accuracy</a><a>Methodology</a><a>Glossary</a><a>About</a>
        </div>
      </div>
    </footer>
  );
}

function App() {
  const initial = (location.hash || '').replace('#','') === 'nba' ? 'nba' : 'ncaa';
  const [sport, setSport] = useState(initial);
  return (
    <div className="mfx-upmode">
      <Nav sport={sport} setSport={setSport} />
      <Hub sport={sport} />
      <Footer />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
